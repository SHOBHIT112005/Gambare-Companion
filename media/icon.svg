<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cute anime face icon for the sidebar activity bar -->
    <!-- Head outline -->
    <circle cx="12" cy="11" r="8" />
    <!-- Left eye -->
    <ellipse cx="9.5" cy="10" rx="1" ry="1.3" fill="currentColor" stroke="none"/>
    <!-- Right eye -->
    <ellipse cx="14.5" cy="10" rx="1" ry="1.3" fill="currentColor" stroke="none"/>
    <!-- Smile -->
    <path d="M9,13.5 Q12,16 15,13.5" fill="none"/>
    <!-- Left hair strand -->
    <path d="M4,9 Q3,14 4,17" />
    <!-- Right hair strand -->  
    <path d="M20,9 Q21,14 20,17" />
    <!-- Bangs -->
    <path d="M6,7 Q8,3 12,2.5 Q16,3 18,7" />
    <!-- Star hair clip -->
    <polygon points="6,6 6.5,7.2 7.8,7.2 6.8,8 7.2,9.2 6,8.4 4.8,9.2 5.2,8 4.2,7.2 5.5,7.2" fill="currentColor" stroke="none"/>
</svg>
